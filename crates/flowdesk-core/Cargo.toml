[package]
name = "flowdesk-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
dirs = "5"
postcard = { version = "1", features = ["use-std"] }
rdev = { version = "0.5.3", features = ["serialize", "unstable_grab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
